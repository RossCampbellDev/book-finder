[project]
name = "book-finder"
version = "0.1.0"
description = "A simple app for locating special books"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.2",
    "flask-login>=0.6.3",
    "flask-limiter>=3.5.0",
    "flask-wtf>=1.2.1",
    "flask-talisman>=1.1.0",
    "gunicorn>=23.0.0",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.1",
    "email-validator>=2.1.0",
    "bcrypt>=4.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-flask>=1.3.0",
    "black>=23.12.0",
    "flake8>=7.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
# Target Python 3.12+
target-version = "py312"

# Line length to match Black
line-length = 100

# Enable these rule sets
lint.select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "PTH",   # flake8-use-pathlib
]

# Ignore these specific rules
lint.ignore = [
    "E501",   # line too long (handled by formatter)
    "PTH123", # pathlib open - we use regular open() in many places
]

# Exclude these directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
]

# Allow autofix for these rules
lint.fixable = ["ALL"]
lint.unfixable = []

# Format configuration
[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Auto-detect line endings
line-ending = "auto"
