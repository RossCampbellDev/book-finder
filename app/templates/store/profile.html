{% extends "base.html" %}

{% block title %}Store Profile - Book Finder{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Store Profile</h1>
    <p>Update your store information</p>

    <form method="POST" action="{{ url_for('store_routes.profile') }}">
        <div class="form-group">
            <label for="name">Store Name:</label>
            <input type="text" id="name" name="name" value="{{ current_user.name }}">
        </div>

        <div class="form-group">
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" value="{{ current_user.address }}">
        </div>

        <div class="form-group">
            <label for="latitude">Latitude:</label>
            <input type="number" id="latitude" name="latitude" step="any" value="{{ current_user.latitude }}">
        </div>

        <div class="form-group">
            <label for="longitude">Longitude:</label>
            <input type="number" id="longitude" name="longitude" step="any" value="{{ current_user.longitude }}">
        </div>

        <div class="form-group">
            <label for="hours">Business Hours:</label>
            <input type="text" id="hours" name="hours" value="{{ current_user.hours }}">
        </div>

        <div class="form-group">
            <label for="contact">Contact Phone:</label>
            <input type="tel" id="contact" name="contact" value="{{ current_user.contact }}">
        </div>

        <div class="form-group">
            <label for="website">Website:</label>
            <input type="url" id="website" name="website" value="{{ current_user.website or '' }}">
        </div>

        <button type="submit" class="btn">Update Profile</button>
        <a href="{{ url_for('store_routes.dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
