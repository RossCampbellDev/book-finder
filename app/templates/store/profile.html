{% extends "base.html" %}

{% block title %}Store Profile - Book Finder{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Store Profile</h1>
    <p>Update your store information</p>

    <form method="POST" action="{{ url_for('store_routes.profile') }}">
        <div class="form-group">
            <label for="name">Store Name:</label>
            <input type="text" id="name" name="name" value="{{ current_user.name }}">
        </div>

        <div class="form-group">
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" value="{{ current_user.address }}" placeholder="123 High Street, Manchester, M1 1AA">
            <button type="button" class="btn btn-secondary" onclick="findCoordinates()" style="margin-top: 0.5rem;">
                Find Coordinates from Address
            </button>
            <div id="geocodeMessage" style="margin-top: 0.5rem; color: #7f8c8d; font-size: 0.9rem;"></div>
        </div>

        <div class="form-group">
            <label for="latitude">
                Latitude:
                <div class="tooltip-container">
                    <span class="tooltip-icon">?</span>
                    <span class="tooltip-text">
                        <strong>How to find your coordinates:</strong>
                        <ol>
                            <li>Open Google Maps in your browser</li>
                            <li>Search for your store address</li>
                            <li>Right-click on the map marker or location</li>
                            <li>Click the coordinates at the top of the menu</li>
                            <li>The coordinates will be copied to your clipboard</li>
                            <li>Paste here - the first number is latitude</li>
                        </ol>
                        Example: 53.4808, -2.2426 (Manchester)
                    </span>
                </div>
            </label>
            <input type="number" id="latitude" name="latitude" step="any" value="{{ current_user.latitude }}" placeholder="e.g., 53.4808">
        </div>

        <div class="form-group">
            <label for="longitude">
                Longitude:
                <div class="tooltip-container">
                    <span class="tooltip-icon">?</span>
                    <span class="tooltip-text">
                        <strong>How to find your coordinates:</strong>
                        <ol>
                            <li>Open Google Maps in your browser</li>
                            <li>Search for your store address</li>
                            <li>Right-click on the map marker or location</li>
                            <li>Click the coordinates at the top of the menu</li>
                            <li>The coordinates will be copied to your clipboard</li>
                            <li>Paste here - the second number is longitude</li>
                        </ol>
                        Example: 53.4808, -2.2426 (Manchester)
                    </span>
                </div>
            </label>
            <input type="number" id="longitude" name="longitude" step="any" value="{{ current_user.longitude }}" placeholder="e.g., -2.2426">
        </div>

        <div class="form-group">
            <label for="hours">Business Hours:</label>
            <input type="text" id="hours" name="hours" value="{{ current_user.hours }}">
        </div>

        <div class="form-group">
            <label for="contact">Contact Phone:</label>
            <input type="tel" id="contact" name="contact" value="{{ current_user.contact }}">
        </div>

        <div class="form-group">
            <label for="website">Website:</label>
            <input type="url" id="website" name="website" value="{{ current_user.website or '' }}">
        </div>

        <button type="submit" class="btn">Update Profile</button>
        <a href="{{ url_for('store_routes.dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

{% block extra_js %}
<script>
    async function findCoordinates() {
        const addressInput = document.getElementById('address');
        const latInput = document.getElementById('latitude');
        const lonInput = document.getElementById('longitude');
        const messageDiv = document.getElementById('geocodeMessage');

        const address = addressInput.value.trim();

        if (!address) {
            messageDiv.textContent = 'Please enter an address first';
            messageDiv.style.color = '#e74c3c';
            return;
        }

        messageDiv.textContent = 'Searching for coordinates...';
        messageDiv.style.color = '#7f8c8d';

        try {
            // Use Nominatim (OpenStreetMap) geocoding API - restrict to UK
            const response = await fetch(
                `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address)}&format=json&limit=1&countrycodes=gb`,
                {
                    headers: {
                        'User-Agent': 'BookFinder/1.0'
                    }
                }
            );

            const data = await response.json();

            if (data && data.length > 0) {
                const lat = parseFloat(data[0].lat);
                const lon = parseFloat(data[0].lon);

                latInput.value = lat;
                lonInput.value = lon;

                messageDiv.textContent = `✓ Coordinates found: ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                messageDiv.style.color = '#27ae60';
            } else {
                messageDiv.textContent = '✗ Address not found. Please try a more detailed address or enter coordinates manually.';
                messageDiv.style.color = '#e74c3c';
            }
        } catch (error) {
            console.error('Geocoding error:', error);
            messageDiv.textContent = '✗ Error finding coordinates. Please try again or enter manually.';
            messageDiv.style.color = '#e74c3c';
        }
    }
</script>
{% endblock %}
