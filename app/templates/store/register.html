{% extends "base.html" %}

{% block title %}Register Store - Book Finder{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Register Your Store</h1>
    <p>Join our network and make your books discoverable to local customers</p>

    <form method="POST" action="{{ url_for('store_routes.register') }}">
        <div class="form-group">
            <label for="name">Store Name: *</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">Email: *</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="password">Password: *</label>
            <input type="password" id="password" name="password" required minlength="6">
        </div>

        <div class="form-group">
            <label for="store_type">Store Type:</label>
            <select id="store_type" name="store_type">
                <option value="bookstore">Bookstore</option>
                <option value="library">Library</option>
                <option value="thrift">Thrift Store</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="address">Address: *</label>
            <input type="text" id="address" name="address" required placeholder="123 Main St, City, State, Postcode">
            <button type="button" class="btn btn-secondary" onclick="findCoordinates()" style="margin-top: 0.5rem;">
                Find Coordinates from Address
            </button>
            <div id="geocodeMessage" style="margin-top: 0.5rem; color: #7f8c8d; font-size: 0.9rem;"></div>
        </div>

        <div class="form-group">
            <label for="latitude">
                Latitude: *
                <div class="tooltip-container">
                    <span class="tooltip-icon">?</span>
                    <span class="tooltip-text">
                        <strong>How to find your coordinates:</strong>
                        <ol>
                            <li>Open Google Maps in your browser</li>
                            <li>Search for your store address</li>
                            <li>Right-click on the map marker or location</li>
                            <li>Click the coordinates at the top of the menu</li>
                            <li>The coordinates will be copied to your clipboard</li>
                            <li>Paste here - the first number is latitude</li>
                        </ol>
                        Example: 40.7128, -74.0060
                    </span>
                </div>
            </label>
            <input type="number" id="latitude" name="latitude" step="any" required placeholder="e.g., 40.7128">
        </div>

        <div class="form-group">
            <label for="longitude">
                Longitude: *
                <div class="tooltip-container">
                    <span class="tooltip-icon">?</span>
                    <span class="tooltip-text">
                        <strong>How to find your coordinates:</strong>
                        <ol>
                            <li>Open Google Maps in your browser</li>
                            <li>Search for your store address</li>
                            <li>Right-click on the map marker or location</li>
                            <li>Click the coordinates at the top of the menu</li>
                            <li>The coordinates will be copied to your clipboard</li>
                            <li>Paste here - the second number is longitude</li>
                        </ol>
                        Example: 40.7128, -74.0060
                    </span>
                </div>
            </label>
            <input type="number" id="longitude" name="longitude" step="any" required placeholder="e.g., -74.0060">
        </div>

        <div class="form-group">
            <label for="hours">Business Hours: *</label>
            <input type="text" id="hours" name="hours" placeholder="Mon-Fri 9AM-5PM" required>
        </div>

        <div class="form-group">
            <label for="contact">Contact Phone: *</label>
            <input type="tel" id="contact" name="contact" required>
        </div>

        <div class="form-group">
            <label for="website">Website (optional):</label>
            <input type="url" id="website" name="website" placeholder="https://example.com">
        </div>

        <button type="submit" class="btn">Register Store</button>
    </form>

    <p style="margin-top: 1rem;">
        Already have an account? <a href="{{ url_for('store_routes.login') }}">Login here</a>
    </p>

    <p style="margin-top: 1rem; color: #7f8c8d; font-size: 0.9rem;">
        <small>* Required fields</small>
    </p>
</div>

{% block extra_js %}
<script>
    async function findCoordinates() {
        const addressInput = document.getElementById('address');
        const latInput = document.getElementById('latitude');
        const lonInput = document.getElementById('longitude');
        const messageDiv = document.getElementById('geocodeMessage');

        const address = addressInput.value.trim();

        if (!address) {
            messageDiv.textContent = 'Please enter an address first';
            messageDiv.style.color = '#e74c3c';
            return;
        }

        messageDiv.textContent = 'Searching for coordinates...';
        messageDiv.style.color = '#7f8c8d';

        try {
            // Use Nominatim (OpenStreetMap) geocoding API
            const response = await fetch(
                `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address)}&format=json&limit=1`,
                {
                    headers: {
                        'User-Agent': 'BookFinder/1.0'
                    }
                }
            );

            const data = await response.json();

            if (data && data.length > 0) {
                const lat = parseFloat(data[0].lat);
                const lon = parseFloat(data[0].lon);

                latInput.value = lat;
                lonInput.value = lon;

                messageDiv.textContent = `✓ Coordinates found: ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                messageDiv.style.color = '#27ae60';
            } else {
                messageDiv.textContent = '✗ Address not found. Please try a more detailed address or enter coordinates manually.';
                messageDiv.style.color = '#e74c3c';
            }
        } catch (error) {
            console.error('Geocoding error:', error);
            messageDiv.textContent = '✗ Error finding coordinates. Please try again or enter manually.';
            messageDiv.style.color = '#e74c3c';
        }
    }
</script>
{% endblock %}
