version: '3.8'

services:
  # MongoDB database service
  mongodb:
    image: mongo:7.0
    container_name: bookfinder-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: bookfinder
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - bookfinder-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Flask web application service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookfinder-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app
      - FLASK_ENV=development
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB_NAME=bookfinder
      - DEBUG=True
      - HOST=0.0.0.0
      - PORT=5000
    volumes:
      - .:/app
    networks:
      - bookfinder-network
    depends_on:
      mongodb:
        condition: service_healthy
    command: ["python", "run.py"]

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  bookfinder-network:
    driver: bridge
